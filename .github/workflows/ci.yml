name: Birdfolio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run server tests
        run: npm run test:ci --prefix server

      - name: Check development environment contract
        run: npm run check:env --prefix server

      - name: Run release preflight
        run: node scripts/check-release.mjs

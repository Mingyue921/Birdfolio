services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: birdfolio
      POSTGRES_USER: birdfolio
      POSTGRES_PASSWORD: local-birdfolio-password
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birdfolio -d birdfolio"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - birdfolio-postgres:/var/lib/postgresql/data

volumes:
  birdfolio-postgres:
